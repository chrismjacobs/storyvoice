{% extends "base.html" %}
{% block title %}Upload book — Storyvoice{% endblock %}
{% block content %}
<div class="card">
  <h1>Upload a book</h1>
  <form method="post" enctype="multipart/form-data" onsubmit="return handleUploadSubmit(this);">
    <label>PDF file
      <input type="file" name="pdf" accept="application/pdf" required autofocus>
    </label>
    <label>Title (optional — defaults to the file name)
      <input type="text" name="title" placeholder="Upload pdf first to auto fill">
    </label>
    <label>Language
      <select name="language" required>
        {% for value, label in language_choices %}
          <option value="{{ value }}">{{ label }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Age level
      <select name="age_level" required>
        {% for value, label in age_level_choices %}
          <option value="{{ value }}">{{ label }}</option>
        {% endfor %}
      </select>
    </label>
    <button type="submit">Upload &amp; render pages</button>
    <p id="upload-status" class="stage-status" hidden>Uploading and rendering pages — this can take a little while for longer books. Don't click Upload again.</p>
  </form>
  <script>
    function handleUploadSubmit(form) {
      const button = form.querySelector("button[type=submit]");
      button.disabled = true;
      button.textContent = "Uploading…";
      form.querySelector("#upload-status").hidden = false;
      return true;
    }

    // Mirrors the server-side fallback in _title_from_filename() so what the
    // user sees before submitting matches what they'd get by leaving it
    // blank. Only overwrites the field while it still holds a value we
    // auto-filled -- once the user types their own title, further file
    // changes stop touching it.
    (function () {
      const pdfInput = document.querySelector('input[name="pdf"]');
      const titleInput = document.querySelector('input[name="title"]');
      let autoFilled = "";

      function titleFromFilename(filename) {
        const stem = filename.replace(/\.[^./\\]+$/, "");
        return stem.replace(/[_-]+/g, " ").replace(/\s+/g, " ").trim();
      }

      pdfInput.addEventListener("change", () => {
        const file = pdfInput.files[0];
        if (!file) return;
        if (titleInput.value === "" || titleInput.value === autoFilled) {
          autoFilled = titleFromFilename(file.name);
          titleInput.value = autoFilled;
        }
      });
    })();
  </script>
</div>
{% endblock %}
