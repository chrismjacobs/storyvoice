{% extends "base.html" %}
{% block title %}Edit {{ book.title }} — Storyvoice{% endblock %}
{% block content %}
<div class="card">
  <h1>Edit book details</h1>
  <form method="post">
    <label>Title
      <input type="text" name="title" value="{{ book.title }}" required autofocus>
    </label>
    <label>Language
      <select name="language" required>
        {% for value, label in language_choices %}
          <option value="{{ value }}" {% if value == book.language %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Age level
      <select name="age_level" required>
        {% for value, label in age_level_choices %}
          <option value="{{ value }}" {% if value == book.age_level %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </label>
    <button type="submit">Save changes</button>
    <a href="{{ url_for('books.view', book_id=book.id) }}">Cancel</a>
  </form>
</div>
{% endblock %}
