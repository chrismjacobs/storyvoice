{% extends "base.html" %}
{% block title %}Register — Storyvoice{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1>Create an account</h1>
  <form method="post">
    <label>Display name
      <input type="text" name="display_name" placeholder="Dad" required autofocus>
    </label>
    <label>Username
      <input type="text" name="username" required>
    </label>
    <label>Password
      <input type="password" name="password" required>
    </label>
    <button type="submit">Create account</button>
  </form>
  <p>Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</div>
{% endblock %}
