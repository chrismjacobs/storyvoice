{% extends "base.html" %}
{% block title %}Listen — {{ book.title }} — Storyvoice{% endblock %}
{% block main_style %}--accent: {{ book.theme_base() }}; --accent-dim: {{ book.theme_dim() }};{% endblock %}

{% block head %}
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="{{ url_for('static', filename='js/viewer.js') }}" defer></script>
{% endblock %}

{% block content %}
<div id="viewer-app">
  <listen-viewer
    :narration-id="{{ narration.id }}"
    book-title="{{ book.title|e }}"
  ></listen-viewer>
</div>
{% endblock %}
